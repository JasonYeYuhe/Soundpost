name: CI

# Test-only CI (M12 §S1): runs the unit suite on a simulator, asserts the build
# is warning-free in our sources, and enforces String Catalog 100% translation.
# Deliberately needs NO signing and NO secrets — it never archives or uploads, so
# nothing here can leak the ASC / Sentry creds (dSYM upload stays in the local
# build-upload pipeline, gated on SENTRY_AUTH_TOKEN).
#
# Runs on macos-26 to match the local toolchain (Xcode 26 / iOS 26 SDK): the app
# uses iOS-26-SDK symbols (e.g. AVAudioSession's renamed `.allowBluetoothHFP`), so
# an older runner (macos-15 / Xcode 16) can't compile it. Deployment target stays
# iOS 17 — only the build SDK must match.

on:
  push:
    # `release/**` too: 1.6.1 was built, uploaded and submitted from a release
    # branch that CI had never once run on, so the only verification behind a
    # shipped binary was a local run on a loaded machine. A branch we ship from
    # needs the same evidence master gets. Fixed on `release/1.6.2` and then lost
    # again here, because the fix was made on the branch and master never got it —
    # so master's CI was quietly weaker than the branch it ships from.
    branches: [main, master, 'release/**']
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test & guard standing bars
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # The toolchain this job claims to test with. Asserted, not just printed: a
      # runner image that moves its default Xcode would otherwise change the
      # compiler under every "CI is green" without a line of this repo changing.
      EXPECTED_XCODE: "Xcode 26.6"
      # The executed-test floor (M20 §4B). `** TEST SUCCEEDED **` is printed by a
      # run that executed nothing, so the marker alone proves nothing. Raise it
      # deliberately when tests are added; never lower it to make a run pass.
      MIN_TESTS: "675"

    steps:
      - uses: actions/checkout@v7

      - name: Show and assert toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version
          ACTUAL="$(xcodebuild -version | head -1)"
          if [ "$ACTUAL" != "$EXPECTED_XCODE" ]; then
            echo "::error::This job claims $EXPECTED_XCODE but the runner has $ACTUAL. Update EXPECTED_XCODE deliberately." >&2
            exit 1
          fi

      # The release tooling's decisions (scripts/asc_policy.py): which app, which
      # version, what may be cancelled. Not a bare `python3 -m unittest` — scripts/
      # is not a package, so that finds 0 tests and on Python < 3.12 still exits 0.
      # Not through `tee` either: this shell has no pipefail. The `Ran N` check is
      # what turns "found nothing" into a failure.
      - name: Release-tooling policy tests
        run: |
          mkdir -p build
          python3 -m unittest discover -s scripts -p 'test_*.py' -v > build/py-tests.log 2>&1 || { cat build/py-tests.log; exit 1; }
          cat build/py-tests.log
          if ! grep -Eq '^Ran [1-9][0-9]* tests?' build/py-tests.log; then
            echo "::error::No release-tooling policy tests ran." >&2
            exit 1
          fi

      - name: Localization gate (xcstrings 100% translated)
        run: ./scripts/check-localization.sh

      - name: Sound-vocabulary gate (M15 labels translated)
        run: ./scripts/check-sound-vocabulary.sh

      - name: Store metadata (lengths + the claims the listing must make)
        run: python3 scripts/check-store-metadata.py

      - name: Debug-only gate (no debug launch argument reaches a Release binary)
        run: ./scripts/check-debug-only.sh

      # Offline half of the CloudKit gate. `status`/`promote` need a management token
      # and the network, so CI cannot run them — which is why the one check standing
      # between a release and a silently non-syncing feature lived only in
      # build-upload-asc.sh, behind a CK_SKIP_SCHEMA_CHECK escape, on a path an Xcode
      # Organizer upload skips entirely. This part needs neither, and catches the
      # drift when it is introduced rather than whenever someone next runs the seed.
      # The other half of the same failure, and the half that had no check at all
      # (M18 §4H). A `@Model` left out of `Schema([...])` is invisible to the schema
      # gate, the seed and the container simultaneously — four green gates over a
      # feature that silently does not sync in Production. This reads the source;
      # `ModelRegistrationTests` asks the built binary the same question.
      - name: CloudKit model registration (every @Model is in the shipping schema)
        run: ./scripts/cloudkit-schema.sh check-models

      - name: CloudKit seed coverage (every entity can be created in Development)
        run: ./scripts/cloudkit-schema.sh check-seed

      - name: Select an available iPhone simulator
        id: sim
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ids=[v['udid'] for rt in sorted(d, reverse=True) for v in d[rt] if v.get('isAvailable') and v['name'].startswith('iPhone')]; print(ids[0] if ids else '')")
          if [ -z "$DEVICE_ID" ]; then echo 'No iPhone simulator available' >&2; exit 1; fi
          echo "Using simulator: $DEVICE_ID"
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Build & test (iOS Simulator)
        run: |
          # Ad-hoc local signing ("-"): needs no Apple identity or provisioning
          # profile (so it works on a runner with no signing creds) yet still
          # signs the embedded Sentry framework enough to load on the simulator —
          # CODE_SIGNING_ALLOWED=NO would leave it unsigned and the host app would
          # SIGTRAP before the test bundle can attach.
          mkdir -p build   # tee + -resultBundlePath need the dir (gitignored, absent on a fresh checkout)
          set +e
          xcodebuild test \
            -project Soundpost.xcodeproj \
            -scheme Soundpost \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.device_id }}" \
            -resultBundlePath build/ci.xcresult \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" \
            PROVISIONING_PROFILE_SPECIFIER="" DEVELOPMENT_TEAM="" \
            | tee build/xcodebuild.log
          set -e
          # xcodebuild can exit non-zero even after "** TEST SUCCEEDED **" (a known
          # post-test/teardown quirk), so gate on the actual result marker.
          if ! grep -q "\*\* TEST SUCCEEDED \*\*" build/xcodebuild.log; then
            echo "Tests did not succeed (no TEST SUCCEEDED marker)." >&2
            exit 1
          fi
          # ...and the marker is printed by a run that executed nothing, so count.
          # `|| true`: under `bash -e` a missing line would otherwise end the step
          # here, silently, before the message below says why.
          EXECUTED="$(grep -Eo 'Test run with [0-9]+ tests?' build/xcodebuild.log | tail -1 | grep -Eo '[0-9]+' || true)"
          if [ -z "$EXECUTED" ]; then
            echo "::error::No 'Test run with N tests' line — this run proves nothing." >&2
            exit 1
          fi
          echo "Executed $EXECUTED tests (floor $MIN_TESTS)."
          if [ "$EXECUTED" -lt "$MIN_TESTS" ]; then
            echo "::error::Only $EXECUTED tests ran; the floor is $MIN_TESTS." >&2
            exit 1
          fi

      - name: Warning gate (warning-free project build)
        run: ./scripts/check-warnings.sh build/xcodebuild.log

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult
          path: build/ci.xcresult
          retention-days: 7
          if-no-files-found: ignore
